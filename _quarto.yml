# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Namjun Cho"                                # Your name
  description: "Namjun is a PhD candidate in Biomedical Engineering at Case Western Reserve University."   # A brief slogan (optional)
  image: img/Campus_Headshot.jpg
  
  favicon: img/fav-icon.jpg
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/fav-icon.png
    
    # your sub-pages
    left:
      - text: "CV"
        href: cv/index.qmd
      - text: "Dashboard"
        href: dashboard/index.qmd
      - text: "blog"
        href: blog/index.qmd
    
    # your social media handles
    right:
      - icon: github
        href: https://github.com/namjuncho/
      - icon: linkedin
        href: https://www.linkedin.com/in/namjun-cho
      - icon: envelope
        aria-label: email
        href: "mailto:namjuncho00@gmail.com"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: img/CWRU.png
    center: |
      
    right: |
      

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true